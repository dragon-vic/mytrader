cache:
  tick_capacity: 1000
  bar_capacity: 1000
reports:
  enabled: true
  root: report
  logging:
    log_level_file: INFO
    log_file_name: node
    log_file_format: null
    log_file_max_size: null
    log_file_max_backup_count: 5
    clear_log_file: true
strategy_defaults:
  use_hyphens_in_client_order_ids: false
project:
  data_dir: data
node:
  actors: {}
  name: trader
  logging:
    log_level: INFO
    strategy_log_level: INFO
    log_colors: true
    component_levels:
      Portfolio: INFO
      ExecClient-BINANCE: WARNING
      BinanceSpotInstrumentProvider: WARNING
      BinanceFuturesInstrumentProvider: WARNING
  data:
    engine:
      validate_data_sequence: false
      qsize: 100000
      graceful_shutdown_on_exception: true
    clients:
      binance_futures:
        enabled: false
        adapter: binance
        client_id: BINANCE_USDT_FUTURES
        venue: BINANCE
        account_type: USDT_FUTURES
        instrument_kind: perpetual
        quote_currency: USDT
        markets: []
      external_json:
        enabled: false
        adapter: external_json
        client_id: EXTERNAL_JSON
        host: 127.0.0.1
        port: 9003
  exec:
    engine:
      reconciliation: true
      reconciliation_scope: null
      qsize: 100000
      graceful_shutdown_on_exception: true
    clients:
      binance_futures:
        enabled: false
        adapter: binance
        client_id: BINANCE_USDT_FUTURES
        venue: BINANCE
        account_type: USDT_FUTURES
        instrument_kind: perpetual
        quote_currency: USDT
        markets: []
        margin_type: CROSS
        confirmed_orders: false
