strategy:
  bintest:
    enabled: true
    strategy_path: strategies.bintest.bintest:BintestStrategy
    config_path: strategies.bintest.bintest:BintestConfig
    config:
      order_id_tag: BINTEST
      instrument_ids:
        - BTCUSDT-PERP.BINANCE
        - ETHUSDT-PERP.BINANCE
        - BTC-USDT.OKX
        - ETH-USDT.OKX
        - BTC-USDT-SWAP.OKX
        - ETH-USDT-SWAP.OKX
        - BTC-USD-PERP.HYPERLIQUID
        - ETH-USD-PERP.HYPERLIQUID
      bar_types:
        - BTCUSDT-PERP.BINANCE-1-SECOND-LAST-INTERNAL
        - ETHUSDT-PERP.BINANCE-1-SECOND-LAST-INTERNAL
        - BTC-USDT.OKX-1-SECOND-LAST-INTERNAL
        - ETH-USDT.OKX-1-SECOND-LAST-INTERNAL
        - BTC-USDT-SWAP.OKX-1-SECOND-LAST-INTERNAL
        - ETH-USDT-SWAP.OKX-1-SECOND-LAST-INTERNAL
        - BTC-USD-PERP.HYPERLIQUID-1-SECOND-LAST-INTERNAL
        - ETH-USD-PERP.HYPERLIQUID-1-SECOND-LAST-INTERNAL
      data_clients:
        BTCUSDT-PERP.BINANCE: BINANCE_USDT_FUTURES
        ETHUSDT-PERP.BINANCE: BINANCE_USDT_FUTURES
        BTC-USDT.OKX: OKX
        ETH-USDT.OKX: OKX
        BTC-USDT-SWAP.OKX: OKX
        ETH-USDT-SWAP.OKX: OKX
        BTC-USD-PERP.HYPERLIQUID: HYPERLIQUID
        ETH-USD-PERP.HYPERLIQUID: HYPERLIQUID
      run_seconds: 30

node:
  actors:
    BINTEST:
      actor_path: strategies.bintest.bintest:BintestActor
      config_path: strategies.bintest.bintest:BintestActorConfig
      config: {}
      artifacts:
        status_path: bintest_status.json

  logging:
    strategy_log_level: INFO

  data:
    clients:
      binance_futures:
        enabled: true
        markets: [BTC/USDT, ETH/USDT]

      okx:
        enabled: true
        adapter: okx
        client_id: OKX
        venue: OKX
        instrument_kind: mixed
        quote_currency: USDT
        markets:
          - symbol: BTC/USDT
            instrument_kind: spot
          - symbol: ETH/USDT
            instrument_kind: spot
          - symbol: BTC/USDT
            instrument_kind: perpetual
          - symbol: ETH/USDT
            instrument_kind: perpetual
        instrument_types: [SPOT, SWAP]
        contract_types: [LINEAR]
        instrument_families: null

      hyperliquid_perp:
        enabled: true
        markets:
          - symbol: BTC/USD
            raw_symbol: BTC
            instrument_symbol: BTC-USD-PERP
          - symbol: ETH/USD
            raw_symbol: ETH
            instrument_symbol: ETH-USD-PERP

      external_signal:
        enabled: true

      external_command:
        enabled: true

  exec:
    engine:
      reconciliation: true
      reconciliation_scope: null

    clients:
      okx:
        enabled: true
        adapter: okx
        client_id: OKX
        venue: OKX
        instrument_kind: mixed
        quote_currency: USDT
        markets:
          - symbol: BTC/USDT
            instrument_kind: spot
          - symbol: ETH/USDT
            instrument_kind: spot
          - symbol: BTC/USDT
            instrument_kind: perpetual
          - symbol: ETH/USDT
            instrument_kind: perpetual
        instrument_types: [SPOT, SWAP]
        contract_types: [LINEAR]
        instrument_families: null
        margin_mode: CROSS

      binance_futures:
        enabled: true
        markets: [BTC/USDT, ETH/USDT]

      hyperliquid_perp:
        enabled: true
        markets:
          - symbol: BTC/USD
            raw_symbol: BTC
            instrument_symbol: BTC-USD-PERP
          - symbol: ETH/USD
            raw_symbol: ETH
            instrument_symbol: ETH-USD-PERP

      # Kraken 缺少 exec 凭证，IBKR 没有运行 TWS/Gateway。
