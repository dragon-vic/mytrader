strategy:
  agent_trading:
    enabled: true
    strategy_path: strategies.agent_trading.agent_trading:AgentTradingStrategy
    config_path: strategies.agent_trading.agent_trading:AgentTradingConfig
    config:
      order_id_tag: AGENT
      schedule_path: strategies/agent_trading/schedules/2026-08-03_2026-08-07.json
      market_universe_path: strategies/agent_trading/schedules/2026-08-03_2026-08-07_market_universe.json
      data_client: BINANCE_USDT_FUTURES
      margin_usdt: 0
      leverage: 10
      min_remaining_pct: 2
      max_mark_age_sec: 5

node:
  logging:
    strategy_log_level: INFO

  data:
    clients:
      binance_futures:
        enabled: true
        markets: all

      external_json:
        enabled: true

