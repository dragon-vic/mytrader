strategy:
  module: preipo_arb
  class: PreipoArbStrategy
  config: PreipoArbConfig
  params:
    assets: [OPENAI, ANTHROPIC, KORU]
    instruments: enabled

    # 启动时读取 collector 保存的最近 3h bid/ask1；不足 3h 就先用已有窗口。
    # 信号至少需要 2h 窗口，collector 不足 2h 时启动后继续等实时 quote 补齐。
    min_window_sec: 7200
    init_fetch_sec: 10800

    # 两条 edge 线分别用 3h 时间等权均线；不再使用 30m 均线/波动做信号。
    grid_center_sec: 10800

    # 每个标的单独配置网格参数，避免顶层默认值和 asset 覆盖值不一致。
    # grid_band_bps: long_edge 低于均线多少开 long；short_edge 高于均线多少开 short。
    # grid_signal_delay_ms: 第一次过线后等待多少毫秒，再用最新 quote 复查；仍过线才交易。
    # grid_step_bps: 同方向加仓的网格间距；short 要比当前最大开仓 edge 更高，long 要比当前最小开仓 edge 更低。
    # grid_open_gap_sec: 非平仓动作之间的最小间隔；0 表示不做时间冷却。
    # grid_max_inventory: 每个标的最多持有的净 pair 数。
    # min_capture_bps: 平仓必须满足对应 pair 的实际 edge capture 下限。
    # trade_qty: 单个标的每次开仓 qty；设为 "0" 时只监控该标的，不提交交易。
    asset_grid_params:
      OPENAI:
        trade_qty: "0.01"
        grid_band_bps:
          long: "24"
          short: "29"
        grid_signal_delay_ms:
          long: 60
          short: 10
        grid_step_bps: "25"
        grid_open_gap_sec: 0
        grid_max_inventory: 1
        min_capture_bps: "0"
      ANTHROPIC:
        trade_qty: "0.1"
        grid_band_bps:
          long: "41"
          short: "41"
        grid_signal_delay_ms:
          long: 70
          short: 70
        grid_step_bps: "25"
        grid_open_gap_sec: 0
        grid_max_inventory: 1
        min_capture_bps: "0"
      KORU:
        trade_qty: "0.1"
        grid_band_bps:
          long: "37"
          short: "47"
        grid_signal_delay_ms:
          long: 100
          short: 80
        grid_step_bps: "25"
        grid_open_gap_sec: 0
        grid_max_inventory: 1
        min_capture_bps: "0"
    trade_qty : "0.01"
    # live 运行时 snapshot 写到当前 report 目录，monitor/start 会读取这个文件显示 rich 表格。
    snapshot_interval_sec: 1
    snapshot_display: file
    snapshot_path: auto
    slippage_bps: "2"
    # 只用于策略开仓前的可用 USDT 检查：required_margin = price * qty / margin_leverage * 1.1。
    # 交易所账户侧杠杆需要单独通过 API/界面保持一致。
    margin_leverage: "5"
    # 每个 quote 后按交易所聚合持仓风险；未实现亏损超过钱包余额 80% 时全平并停止。
    risk_enabled: true
    risk_max_unrealized_loss_ratio: "0.8"
    # KORU quote 量过大时只处理 10%，其余在 on_quote_tick 最开始直接丢弃。
    quote_sample_rates:
      KORU: 0.1
    # quote 在本地 NT 队列中从 ts_init 到 on_quote_tick 超过该值时聚合记录 error summary。
    max_quote_delay_ms: 10
    quote_summary_interval_sec: 5
    use_hyphens_in_client_order_ids: false
    fee_bps:
      BINANCE: 5
      OKX: 5
      KRAKEN: 10
      HYPERLIQUID: 5



logging:
  component_levels:
    Portfolio: WARNING

data:
  clients:
    binance_futures:
      enabled: true
      markets:
        - OPENAI
        - ANTHROPIC
        - KORU

    okx_swap:
      enabled: true
      markets:
        - OPENAI
        - ANTHROPIC
        - KORU

    kraken_futures:
      enabled: false
      markets:
        - symbol: OPENAIX/USD
          raw_symbol: PF_OPENAIXUSD
          instrument_symbol: PF_OPENAIXUSD
          base_currency: OPENAI
        - symbol: ANTHROPICX/USD
          raw_symbol: PF_ANTHROPICXUSD
          instrument_symbol: PF_ANTHROPICXUSD
          base_currency: ANTHROPIC

    # 当前 Hyperliquid 返回 VNTL 标的但 active=false；需要纳入时改 enabled。
    hyperliquid_perp:
      enabled: false
      markets:
        - symbol: VNTL-OPENAI/USD
          raw_symbol: VNTL-OPENAI
          instrument_symbol: VNTL-OPENAI
          base_currency: OPENAI
        - symbol: VNTL-ANTHROPIC/USD
          raw_symbol: VNTL-ANTHROPIC
          instrument_symbol: VNTL-ANTHROPIC
          base_currency: ANTHROPIC

