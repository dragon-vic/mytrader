strategy:
  sk_adr_arb:
    enabled: true
    strategy_path: strategies.sk_adr_arb.sk_adr_arb:SkAdrArbStrategy
    config_path: strategies.sk_adr_arb.sk_adr_arb:SkAdrArbConfig
    config:
      order_id_tag: SKADR
      sk_instrument: SKHYNIXUSDT-PERP.BINANCE
      adr_instrument: SKHYUSDT-PERP.BINANCE
      leverage: 10
      # 最后完整完成的加仓阈值；0 表示 40% 档尚未执行。每次启动前人工确认。
      current_add_position: 0
      first_add_position: 40
      large_add_position: 43
      max_add_position: 50
      # 40%~42% 每档每腿加 2,000U；43%~50% 每档每腿加 4,000U。
      standard_stage_notional: 2000
      large_stage_notional: 4000
      # 所有金额均为单腿名义价值；每组双腿完全成交后等待 5 秒。
      order_notional: 1000
      retry_delay_sec: 5
      price_check_interval_sec: 1
      max_mark_age_sec: 5
      telegram_notify_step: 0.01

node:
  logging:
    strategy_log_level: INFO

  data:
    clients:
      binance_futures:
        enabled: true
        markets:
          - SKHYNIX/USDT
          - SKHY/USDT

  exec:
    engine:
      reconciliation_scope: configured_markets

    clients:
      binance_futures:
        enabled: true
        markets:
          - SKHYNIX/USDT
          - SKHY/USDT
        margin_type: CROSS
        leverage: 10
