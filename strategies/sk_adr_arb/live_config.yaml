strategy:
  sk_adr_arb:
    enabled: true
    strategy_path: strategies.sk_adr_arb.sk_adr_arb:SkAdrArbStrategy
    config_path: strategies.sk_adr_arb.sk_adr_arb:SkAdrArbConfig
    config:
      order_id_tag: SKADR
      sk_instrument: SKHYNIXUSDT-PERP.BINANCE
      adr_instrument: SKHYUSDT-PERP.BINANCE
      leverage: 10
      add_step_notional: 500
      tier_target_notional: 11000
      max_target_notional: 16000
      final_target_notional: 20000
      tier_one_premium: 0.35
      tier_two_premium: 0.40
      tier_three_premium: 0.50
      close_premium: 0.03
      close_leg_notional: 200
      rebalance_threshold: 50
      retry_delay_sec: 10
      price_check_interval_sec: 1
      max_mark_age_sec: 5
      telegram_notify_step: 0.01
      initial_completed_stage: 1
    artifacts:
      stage_snapshot_path: open_stage_snapshot.json

node:
  logging:
    strategy_log_level: INFO

  data:
    clients:
      binance_futures:
        enabled: true
        markets:
          - SKHYNIX/USDT
          - SKHY/USDT

  exec:
    engine:
      reconciliation_scope: configured_markets

    clients:
      binance_futures:
        enabled: true
        markets:
          - SKHYNIX/USDT
          - SKHY/USDT
        margin_type: CROSS
        leverage: 10
