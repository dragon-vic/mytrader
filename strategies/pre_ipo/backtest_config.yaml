strategy:
  module: pre_ipo_backtest
  class: PreIpoQuoteBacktestStrategy
  config: PreIpoQuoteBacktestConfig
  params:
    binance_id: ANTHROPICUSDT-PERP.BINANCE
    okx_id: ANTHROPIC-USDT-SWAP.OKX
    feature_path: strategies/pre_ipo/backtest_data/anthropic_features_6d.parquet
    qty: "1"
    exit_kind: capture
    capture_bps: 150
    short_entry_bps: 100
    long_entry_bps: 100
    short_exit_bps: -20
    long_exit_bps: 0
    window_minutes: 360
    warmup_minutes: 360
    min_hold_sec: 1800
    end_ns: 1782536389613494169

data:
  clients:
    binance_futures:
      enabled: true
      markets:
        - symbol: ANTHROPIC/USDT
          timeframe: 1s
    okx_swap:
      enabled: true
      markets:
        - symbol: ANTHROPIC/USDT
          timeframe: 1s

backtest:
  venues:
    - client: binance_futures
      starting_balance: "100000 USDT"
      account_type: MARGIN
      oms_type: NETTING
      default_leverage: "5"
      use_market_order_acks: true
      latency:
        base_latency_ms: 0
        insert_latency_ms: 100
        update_latency_ms: 0
        cancel_latency_ms: 0
    - client: okx_swap
      starting_balance: "100000 USDT"
      account_type: MARGIN
      oms_type: NETTING
      default_leverage: "5"
      use_market_order_acks: true
      latency:
        base_latency_ms: 0
        insert_latency_ms: 100
        update_latency_ms: 0
        cancel_latency_ms: 0
  datasets:
    - type: quote_ticks
      path: strategies/pre_ipo/backtest_data/anthropic_quotes_6d.parquet
  logging:
    log_level: ERROR
    bypass: true
  instrument:
    settlement_currency: USDT
    is_inverse: false
    price_precision: 2
    size_precision: 3
    price_increment: "0.01"
    size_increment: "0.001"
    multiplier: "1"
    min_quantity: "0.001"
    max_quantity: "10000"
    min_notional: "0"
    max_price: "10000000"
    margin_init: "0.2"
    margin_maint: "0.1"
    maker_fee: "0.001"
    taker_fee: "0.001"
