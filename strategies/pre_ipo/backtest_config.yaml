strategy:
  module: pre_ipo_backtest
  class: PreIpoQuoteBacktestStrategy
  config: PreIpoQuoteBacktestConfig
  grid_params:
    entry_bps: [55,50]
    exit_bps: [-15,-17.5,-20]


  case_params:
    binance_id: ANTHROPICUSDT-PERP.BINANCE
    okx_id: ANTHROPIC-USDT-SWAP.OKX
    feature_path: strategies/pre_ipo/backtest_data/anth_features_all.parquet
    qty: 0.2
    std_mult: [2.6]

    capture_bps: [ 70]
    max_position: 2

    short_min_bps: 250
    long_max_bps: 550
    # window_minutes 同时控制 edge 均线、std/band 和 warmup；360 = 6h。
    window_minutes: 360
    min_hold_sec: 0
    signal_delay_ms: 0
    end_ns: 1783076399419884159

data:
  clients:
    binance_futures:
      enabled: true
      markets:
        - symbol: ANTHROPIC/USDT
          timeframe: 1s
    okx_swap:
      enabled: true
      markets:
        - symbol: ANTHROPIC/USDT
          timeframe: 1s

backtest:
  max_workers: 4
  venues:
    - client: binance_futures
      starting_balance: "10000 USDT"
      account_type: MARGIN
      oms_type: NETTING
      default_leverage: "5"
      use_market_order_acks: true
      # bps_slippage 会把实际成交价按方向滑点；10bps 在当前价格附近约 165-173 ticks。
      fill_model:
        type: bps_slippage
        slippage_bps: 1
      latency:
        base_latency_ms: 15
        insert_latency_ms: 15
        update_latency_ms: 0
        cancel_latency_ms: 0
    - client: okx_swap
      starting_balance: "10000 USDT"
      account_type: MARGIN
      oms_type: NETTING
      default_leverage: "5"
      use_market_order_acks: true
      # bps_slippage 会把实际成交价按方向滑点；10bps 在当前价格附近约 165-173 ticks。
      fill_model:
        type: bps_slippage
        slippage_bps: 5
      latency:
        base_latency_ms: 15
        insert_latency_ms: 30
        update_latency_ms: 0
        cancel_latency_ms: 0
  datasets:
    - type: quote_tick_objects
      path: strategies/pre_ipo/backtest_data/anth_quote_ticks_all.pkl
  logging:
    log_level: ERROR
    bypass: true
  instrument:
    settlement_currency: USDT
    is_inverse: false
    price_precision: 2
    size_precision: 3
    price_increment: "0.01"
    size_increment: "0.001"
    multiplier: "1"
    min_quantity: "0.001"
    max_quantity: "10000"
    min_notional: "0"
    max_price: "10000000"
    margin_init: "0.2"
    margin_maint: "0.1"
    maker_fee: "0.0002"
    taker_fee: "0.0004"
