strategy:
  ANTHROPIC:
    enabled: true
    strategy_path: strategies.pre_ipo.pre_ipo_arb:PreIpoArbStrategy
    config_path: strategies.pre_ipo.pre_ipo_arb:PreIpoArbConfig
    config:
      order_id_tag: ANTHROPIC
      asset: ANTHROPIC
      instruments:
        - ANTHROPICUSDT-PERP.BINANCE
        - ANTHROPIC-USDT-SWAP.OKX
      # 启动 reconciliation 将两个 instrument 的已有订单和仓位归当前策略；startup 会严格检查后接管。
      external_order_claims:
        - ANTHROPICUSDT-PERP.BINANCE
        - ANTHROPIC-USDT-SWAP.OKX
      # OKX 2026-06-30 对 ANTHROPIC 做 rebase：价格 /10，数量 *10。
      okx_multiplier: 10
      # window_minutes 同时控制启动时读取 collector 的范围，以及 edge 均值/std 的时间窗口；300 = 5h。
      window_minutes: 300

      # long_edge 低于均线 entry 开 long；short_edge 高于均线 entry 开 short。
      # 持仓后反向 edge 越过均线 exit_bps 才减仓；exit_bps 使用正的距离。
      entry_bps: 55
      exit_bps: 20
      std_mult: 3.0
      short_min_bps: 200
      long_max_bps: 520
      qty: 0.1
      # 仅用于开仓保证金检查和风控 lock 估算；不会修改交易所实际杠杆。
      margin_leverage: 5
      margin_buffer: 1.1

  OPENAI:
    enabled: true
    strategy_path: strategies.pre_ipo.pre_ipo_arb:PreIpoArbStrategy
    config_path: strategies.pre_ipo.pre_ipo_arb:PreIpoArbConfig
    config:
      order_id_tag: OPENAI
      asset: OPENAI
      instruments:
        - OPENAIUSDT-PERP.BINANCE
        - OPENAI-USDT-SWAP.OKX
      external_order_claims:
        - OPENAIUSDT-PERP.BINANCE
        - OPENAI-USDT-SWAP.OKX
      # OKX 的 OPENAI 价格是 Binance 的约 1/10，数量对应放大 10 倍。
      okx_multiplier: 10
      window_minutes: 300

      entry_bps: 55
      exit_bps: 20
      std_mult: 3.0
      short_min_bps: 150
      long_max_bps: 350
      qty: 0.1
      margin_leverage: 5
      margin_buffer: 1.1


node:
  actors:
    PRE_IPO:
      actor_path: strategies.pre_ipo.coordinator:PreIpoCoordinatorActor
      config_path: strategies.pre_ipo.coordinator:PreIpoCoordinatorConfig
      config:
        assets: [ANTHROPIC, OPENAI]
        # 两个策略共享；分别限制每个 venue 的策略估算保证金占用。
        max_lock: 500
        reduce_risk_rate: "0.70"
        stop_risk_rate: "0.85"
      artifacts:
        snapshot_path: pre_ipo_snapshot.json

  logging:
    component_levels:
      Portfolio: WARNING


  data:
    clients:
      external_command:
        enabled: true
        host: 127.0.0.1
        port: 9002

      binance_futures:
        enabled: true
        markets:
          - ANTHROPIC
          - OPENAI

      okx_swap:
        enabled: true
        markets:
          - ANTHROPIC
          - OPENAI

      kraken_futures:
        enabled: false
        markets:
          - symbol: OPENAIX/USD
            raw_symbol: PF_OPENAIXUSD
            instrument_symbol: PF_OPENAIXUSD
            base_currency: OPENAI
          - symbol: ANTHROPICX/USD
            raw_symbol: PF_ANTHROPICXUSD
            instrument_symbol: PF_ANTHROPICXUSD
            base_currency: ANTHROPIC

      # 当前 Hyperliquid 返回 VNTL 标的但 active=false；需要纳入时改 enabled。
      hyperliquid_perp:
        enabled: false
        markets:
          - symbol: VNTL-OPENAI/USD
            raw_symbol: VNTL-OPENAI
            instrument_symbol: VNTL-OPENAI
            base_currency: OPENAI
          - symbol: VNTL-ANTHROPIC/USD
            raw_symbol: VNTL-ANTHROPIC
            instrument_symbol: VNTL-ANTHROPIC
            base_currency: ANTHROPIC


  exec:
    engine:
      # 启动时回看最近 24h 的订单和成交，用于恢复交易所执行状态。
      reconciliation_lookback_mins: 1440

    clients:
      binance_futures:
        enabled: true
        markets:
          - ANTHROPIC
          - OPENAI

      okx_swap:
        enabled: true
        markets:
          - ANTHROPIC
          - OPENAI

      kraken_futures:
        enabled: false
        markets:
          - symbol: OPENAIX/USD
            raw_symbol: PF_OPENAIXUSD
            instrument_symbol: PF_OPENAIXUSD
            base_currency: OPENAI
          - symbol: ANTHROPICX/USD
            raw_symbol: PF_ANTHROPICXUSD
            instrument_symbol: PF_ANTHROPICXUSD
            base_currency: ANTHROPIC

      hyperliquid_perp:
        enabled: false
        markets:
          - symbol: VNTL-OPENAI/USD
            raw_symbol: VNTL-OPENAI
            instrument_symbol: VNTL-OPENAI
            base_currency: OPENAI
          - symbol: VNTL-ANTHROPIC/USD
            raw_symbol: VNTL-ANTHROPIC
            instrument_symbol: VNTL-ANTHROPIC
            base_currency: ANTHROPIC
