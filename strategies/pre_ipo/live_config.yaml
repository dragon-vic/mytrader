strategy:
  ANTH:
    module: anthropic_arb
    class: AnthropicArbStrategy
    config: AnthropicArbConfig
    params:
      instruments: enabled
      # OKX 2026-06-30 对 ANTHROPIC 做 rebase：价格 /10，数量 *10。
      okx_multiplier: 10
      # window_minutes 同时控制启动时读取 collector 的范围，以及 edge 均值/std 的时间窗口；360 = 6h。
      window_minutes: 360

      # long_edge 低于均线 entry 开 long；short_edge 高于均线 entry 开 short。
      # 持仓后反向 edge 偏离 exit 就减仓或翻向；reduce mode 只允许减仓方向。
      entry_bps: 50
      exit_bps: -20
      std_mult: 2.6
      short_min_bps: 250
      long_max_bps: 560
      max_position: 0.3
      qty: 0.01
      margin_leverage: 5
      margin_buffer: 1.1

      # live 运行时 snapshot 写到当前 report 目录，monitor/start 会读取这个文件显示 rich 表格。
      snapshot_path: auto


node:
  logging:
    component_levels:
      Portfolio: WARNING


  data:
    clients:
      external_command:
        enabled: true
        host: 127.0.0.1
        port: 9002

      binance_futures:
        enabled: true
        markets:
          - ANTHROPIC

      okx_swap:
        enabled: true
        markets:
          - ANTHROPIC

      kraken_futures:
        enabled: false
        markets:
          - symbol: OPENAIX/USD
            raw_symbol: PF_OPENAIXUSD
            instrument_symbol: PF_OPENAIXUSD
            base_currency: OPENAI
          - symbol: ANTHROPICX/USD
            raw_symbol: PF_ANTHROPICXUSD
            instrument_symbol: PF_ANTHROPICXUSD
            base_currency: ANTHROPIC

      # 当前 Hyperliquid 返回 VNTL 标的但 active=false；需要纳入时改 enabled。
      hyperliquid_perp:
        enabled: false
        markets:
          - symbol: VNTL-OPENAI/USD
            raw_symbol: VNTL-OPENAI
            instrument_symbol: VNTL-OPENAI
            base_currency: OPENAI
          - symbol: VNTL-ANTHROPIC/USD
            raw_symbol: VNTL-ANTHROPIC
            instrument_symbol: VNTL-ANTHROPIC
            base_currency: ANTHROPIC


  exec:
    engine:
      # 启动对账只回看最近 6h，避免 OKX 旧 pre-market 订单/fill 在启动时大量重建。
      reconciliation_lookback_mins: 360

    clients:
      binance_futures:
        enabled: true
        markets:
          - ANTHROPIC

      okx_swap:
        enabled: true
        markets:
          - ANTHROPIC

      kraken_futures:
        enabled: false
        markets:
          - symbol: OPENAIX/USD
            raw_symbol: PF_OPENAIXUSD
            instrument_symbol: PF_OPENAIXUSD
            base_currency: OPENAI
          - symbol: ANTHROPICX/USD
            raw_symbol: PF_ANTHROPICXUSD
            instrument_symbol: PF_ANTHROPICXUSD
            base_currency: ANTHROPIC

      hyperliquid_perp:
        enabled: false
        markets:
          - symbol: VNTL-OPENAI/USD
            raw_symbol: VNTL-OPENAI
            instrument_symbol: VNTL-OPENAI
            base_currency: OPENAI
          - symbol: VNTL-ANTHROPIC/USD
            raw_symbol: VNTL-ANTHROPIC
            instrument_symbol: VNTL-ANTHROPIC
            base_currency: ANTHROPIC
