strategy:
  module: koru
  class: KoruStrategy
  config: KoruConfig
  params:
    assets: [KORU]
    instruments: enabled

    # 启动时读取 collector 保存的最近 3h bid/ask1；不足 3h 就先用已有窗口。
    min_window_sec: 7200
    init_fetch_sec: 10800
    grid_center_sec: 10800

    # KORU 单独运行，交易判断必须使用最新 quote；不要再用采样丢盘口。
    asset_grid_params:
      KORU:
        trade_qty: "0.1"
        grid_band_bps:
          long:
            min: "37"
            std_mult: "0"
          short:
            min: "47"
            std_mult: "0"
        grid_signal_delay_ms:
          long: 100
          short: 80
        grid_step_bps: "25"
        grid_open_gap_sec: 0
        grid_max_inventory: 1
        min_capture_bps: "0"
    trade_qty: "0.1"
    snapshot_interval_sec: 1
    snapshot_display: file
    snapshot_path: auto
    slippage_bps: "2"
    margin_leverage: "5"
    risk_enabled: true
    risk_max_unrealized_loss_ratio: "0.8"
    quote_sample_rates: {}
    max_quote_delay_ms: 10
    quote_summary_interval_sec: 5
    use_hyphens_in_client_order_ids: false
    fee_bps:
      BINANCE: 5
      OKX: 5
      KRAKEN: 10
      HYPERLIQUID: 5


node:
  logging:
    component_levels:
      Portfolio: WARNING


  data:
    clients:
      binance_futures:
        enabled: true
        markets:
          - KORU

      okx_swap:
        enabled: true
        markets:
          - KORU


  exec:
    clients:
      binance_futures:
        enabled: true
        markets:
          - KORU

      okx_swap:
        enabled: true
        markets:
          - KORU
