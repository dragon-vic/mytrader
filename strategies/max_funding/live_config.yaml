strategy:
  max_funding:
    module: max_funding
    class: MaxFundingStrategy
    config: MaxFundingConfig
    params:
      instrument_client: binance_futures
      notional_min: "6"
      notional_max: "30"
      notional_scale: "1"
      notional_base_score_bps: "10"
      max_trades: 3
      min_rate_bps: "30"
      xgb_primary: node_2000_ensemble_live
      xgb_models:
        - name: node_2000_ensemble_live
          path: strategies/max_funding/data/node_select_2000ms_ensemble_live.joblib
          kind: ensemble_node_select
          score: ens_avg_adj20
      trade_symbols: all
      exclude_symbols: []
      pre_sec: 2.5
      entry_sec: 1.0
      pre_deadline: 0.4
      entry_before: 0.3
      exit_sec: 0.25
      protect_giveback_bps: "30"
      post_sec: 10
      funding_income_delay_sec: 6
      api_url: https://fapi.binance.com
      api_timeout: 0.8
      stop_close: true

node:
  logging:
    strategy_log_level: INFO

  data:
    clients:
      binance_futures:
        enabled: true
        markets: all

  exec:
    clients:
      binance_futures:
        enabled: true
        markets: all
