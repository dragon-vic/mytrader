strategy:
  name: poly_test
  params:
    max_ticks: 0
    timeout_sec: 0
    flush_sec: 30
    poly_trade_path: auto
    poly_quote_path: auto
    binance_tick_path: auto
    btc_spot_instrument_id: BTCUSDT.BINANCE

data:
  clients:
    polymarket:
      enabled: true
      markets: all
      instrument_provider:
        event_slug_builder: utils.polymarket_btc5m:build_event_slugs

    binance_spot:
      enabled: true
      markets: [BTC]

exec:
  engine:
    reconciliation_scope: configured_markets

  clients:
    polymarket:
      enabled: true
      markets: all
      instrument_provider:
        event_slug_builder: utils.polymarket_btc5m:build_event_slugs

reports:
  enabled: true
