# 手动测试：20 个 selected USDT 永续白名单逐个下单并立即撤单。
market_defaults:
  timeframe: 1m

markets:
  - symbol: 1000000BOB/USDT
  - symbol: AXS/USDT
  - symbol: BARD/USDT
  - symbol: CFG/USDT
  - symbol: COS/USDT
  - symbol: DRIFT/USDT
  - symbol: ENJ/USDT
  - symbol: ENSO/USDT
  - symbol: GUA/USDT
  - symbol: KITE/USDT
  - symbol: LYN/USDT
  - symbol: NOM/USDT
  - symbol: ORCA/USDT
  - symbol: POWER/USDT
  - symbol: RAVE/USDT
  - symbol: RIVER/USDT
  - symbol: SAHARA/USDT
  - symbol: SIREN/USDT
  - symbol: SOON/USDT
  - symbol: STEEM/USDT

strategy:
  name: manual_order_probe
  trade_notional: "5"
  params:
    price_offset_bps: 300          # 卖出限价 = 当前 ask * 1.03，post-only 避免立即成交
    cancel_retries: 3              # 撤单失败时重试次数
    stop_when_done: true           # 20 个品种完成后停止节点

# 实盘账户；不配置 leverage/margin_type，保持交易所当前设置。
live:
  account_type: USDT_FUTURES
  log_level_file: INFO

backtest:
  starting_balance: "100000 USDT"
  account_type: MARGIN
  oms_type: NETTING
  log_level: INFO
  log_bypass: true
  data:
    limit: 1000
    batches: 1
