# 常改：交易对和行情周期。
market:
  symbol: TRUMP/USDT                 # Binance U 本位 ORCA 永续
  timeframe: 1m                     # live 订阅 1m bar
  limit: 1000                       # 拉取 K 线数量
  batches: 1                        # 拉取批次数

# 常改：策略参数。
strategy:
  name: watch                       # 自动推导 strategies.watch / Watch / WatchConfig
  trade_size: "0"                   # 只为兼容构建入口；本策略不下单，不使用这个值
  params:
    external_order_claims: true     # true 表示自动认领当前 set 里所有 instrument 的外部订单

# 常改：live 运行参数。
live:
  account_type: USDT_FUTURES        # Binance U 本位合约账户
  log_level_file: INFO
  margin_type: ISOLATED

# 常改：回测账户参数；本策略主要用于 live 观察。
backtest:
  starting_balance: "100000 USDT"   # 回测初始资金
  account_type: MARGIN              # NT 回测账户类型
  oms_type: NETTING                 # 净持仓模式
  log_level: INFO                   # NT 控制台日志级别
  log_bypass: true                  # 回测时减少完整 NT 日志

# 低频：ORCAUSDT 永续合约精度和限制。
instrument:
  kind: perpetual                   # U 本位永续合约
  settlement_currency: USDT         # 结算币种
  is_inverse: false                 # false 表示 U 本位正向合约
  price_precision: 7                # Binance ORCAUSDT pricePrecision
  size_precision: 1                 # Binance ORCAUSDT quantityPrecision
  price_increment: "0.0010000"      # 最小价格跳动
  size_increment: "0.1"             # 最小数量跳动
  multiplier: "1"                   # 合约乘数
  min_quantity: "0.1"               # 最小下单数量
  max_quantity: "200000"            # 最大下单数量
  min_notional: "5"                 # 最小名义金额
  max_price: "2000"                 # 允许最大价格
  margin_init: "1"                  # 回测用初始保证金比例
  margin_maint: "1"                 # 回测用维持保证金比例
  maker_fee: "0.0002"               # maker 手续费率
  taker_fee: "0.0005"               # taker 手续费率
