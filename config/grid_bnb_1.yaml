# 常改：策略和参数。
strategy:
  name: grid_rebalance
  trade_notional: "100"
  params:
    grid_step_bps: 700
    max_levels: 2
    reset_bars: 4
    close_positions_on_stop: true

# 常改：交易对和周期。
market:
  symbol: BNB/USDT
  timeframe: 1h

# 常改：live 账户类型。
live:
  account_type: USDT_FUTURES

# 常改：回测账户。
backtest:
  starting_balance: "100000 USDT"
  account_type: MARGIN
  oms_type: NETTING
  log_level: INFO
  log_bypass: true
  data:
    limit: 1000
    batches: 8
  instrument:
    settlement_currency: USDT
    is_inverse: false
    price_precision: 2
    size_precision: 2
    price_increment: "0.01"
    size_increment: "0.01"
    multiplier: "1"
    min_quantity: "0.01"
    max_quantity: "10000000"
    min_notional: "5"
    max_price: "10000000"
    margin_init: "1"
    margin_maint: "1"
    maker_fee: "0.0002"
    taker_fee: "0.0005"

# 低频：live 只需要市场类型来推导 NT symbol。
instrument:
  kind: perpetual
