# 常改：交易对和行情周期。
market:
  symbol: ORCA/USDT                 # Binance U 本位 ORCA 永续
  timeframe: 1m                     # bar 回测备用，live 默认用 tick
  limit: 1000                       # 拉取 K 线数量
  batches: 1                        # 拉取批次数

# 常改：策略参数。
strategy:
  name: orca_short                  # 会自动推导 strategies.orca_short / OrcaShort / OrcaShortConfig
  trade_notional: "1000"            # 目标开空名义金额，单位 USDT
  params:
    use_trade_ticks: true           # live 用成交 tick 触发启动逻辑
    close_positions_on_stop: true   # 正常停止或外部信号停止时平仓

# 常改：live 运行参数。
live:
  environment: TESTNET              # TESTNET / LIVE
  run_seconds: 600                  # 没收到外部信号时最多运行 10 分钟
  account_type: USDT_FUTURES        # Binance U 本位合约账户
  api_key_env: BINANCE_FUTURES_TESTNET_API_KEY       # .env 里的 API key 变量名
  api_secret_env: BINANCE_FUTURES_TESTNET_API_SECRET # .env 里的 API secret 变量名
  log_level_file: INFO              # live_raw.log 文件日志级别

# 常改：回测账户参数。
backtest:
  starting_balance: "100000 USDT"   # 回测初始资金
  account_type: MARGIN              # NT 回测账户类型
  oms_type: NETTING                 # 净持仓模式
  log_level: INFO                   # NT 控制台日志级别
  log_bypass: true                  # 回测批量跑时减少完整 NT 日志

# 低频：ORCAUSDT 永续合约精度和限制。
instrument:
  kind: perpetual                   # U 本位永续合约
  settlement_currency: USDT         # 结算币
  is_inverse: false                 # false 表示 U 本位正向合约
  price_precision: 7                # Binance ORCAUSDT pricePrecision
  size_precision: 1                 # Binance ORCAUSDT quantityPrecision
  price_increment: "0.0010000"      # 最小价格跳动
  size_increment: "0.1"             # 最小数量跳动
  multiplier: "1"                   # 合约乘数
  min_quantity: "0.1"               # 最小下单数量
  max_quantity: "200000"            # 最大下单数量
  min_notional: "5"                 # 最小名义金额
  max_price: "2000"                 # 允许最大价格
  margin_init: "1"                  # 回测用初始保证金比例
  margin_maint: "1"                 # 回测用维持保证金比例
  maker_fee: "0.0002"               # maker 手续费率
  taker_fee: "0.0005"               # taker 手续费率
