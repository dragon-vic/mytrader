strategy:
  name: backtestfunding
  modes: [backtest]
  params:
    trade_notional: "1000"
    min_rate_bps: "50"
    trade_symbols: all
    exclude_symbols: [LYN, BEAT, PIPPIN, RAVE, SOON, SENT, ORCA]
    events_path: data/funding/ALL-20250101.parquet
    entry_before_ms: 500
    exit_after_ms: 1000

exchange:
  venue: BINANCE

backtest:
  markets: all
  tick_data_path: data/tick/ALL-FUNDING-EVENTS-20250101.parquet
  starting_balance: "1000 USDT"
  account_type: MARGIN
  oms_type: NETTING
  log_level: WARNING
  log_bypass: true
  instrument:
    settlement_currency: USDT
    is_inverse: false
    price_precision: 7
    size_precision: 3
    price_increment: "0.0000001"
    size_increment: "0.001"
    multiplier: "1"
    min_quantity: "0.001"
    max_quantity: "100000000"
    min_notional: "5"
    max_price: "10000000"
    margin_init: "1"
    margin_maint: "1"
    maker_fee: "0.0002"
    taker_fee: "0.0005"
