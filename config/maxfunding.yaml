strategy:
  name: max_funding
  params:
    instrument_client: binance_futures
    trade_notional: "6"
    notional_min_multiplier: "1.00"
    notional_base_score_bps: "20"
    notional_max_score_bps: "45"
    notional_max: "30"
    max_trades: 3
    min_rate_bps: "30"
    xgb_primary: node_2000_ensemble_live
    xgb_models:
      - name: node_2000_ensemble_live
        path: strategies/maxfunding/node_select_2000ms_ensemble_live.joblib
        kind: ensemble_node_select
        score: ens_avg_adj20
    trade_symbols: all
    exclude_symbols: []
    pre_sec: 2.5
    entry_sec: 1.0
    pre_deadline: 0.5
    entry_before: 0.3
    exit_sec: 0.15
    post_sec: 10
    funding_income_delay_sec: 6
    api_url: https://fapi.binance.com
    api_timeout: 0.8
    stop_close: true

logging:
  strategy_log_level: INFO

data:
  clients:
    binance_futures:
      enabled: true
      markets: all

exec:
  clients:
    binance_futures:
      enabled: true
      markets: all

backtest:
  markets: [1000000BOB, AXS, BARD, CFG, COS,
            DRIFT, ENJ, ENSO, GTC, GUA,
            KITE, LYN, NOM, ORCA, POWER,
            RAVE, RIVER, SAHARA, SIREN, SOON,
            STEEM, SIGN, CHIP, MBOX, VIC,
            BB, SOLV, MEGA, INJ, DOGS,
            SAPIEN, KERNEL, COMP, SAGA, MOVE]
  venue_account:
    starting_balance: "100000 USDT"
    account_type: MARGIN
    oms_type: NETTING
  logging:
    log_level: INFO
    bypass: true
  data:
    timeframe: 1s
    limit: 1000
    batches: 1
  instrument:
    settlement_currency: USDT
    is_inverse: false
    price_precision: 5
    size_precision: 1
    price_increment: "0.00010"
    size_increment: "0.1"
    multiplier: "1"
    min_quantity: "0.1"
    max_quantity: "1000000"
    min_notional: "5"
    max_price: "1000000"
    margin_init: "1"
    margin_maint: "1"
    maker_fee: "0.0002"
    taker_fee: "0.0005"
