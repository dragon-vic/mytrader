# 常改：交易对、周期和数据量。
market:
  symbol: ORCA/USDT                 # 当前 funding 实盘测试币种，ORCA 是 1h funding 间隔
  timeframe: 1m                     # bar 回测备用；live tick 模式不靠 bar 触发

# 常改：策略和资金费参数。
strategy:
  name: funding                     # 策略名，会推导 module/class/config_class
  trade_size: "10"                  # 测试网小仓位，按 ORCA 数量下单，名义金额需大于 5 USDT
  params:
    funding_csv_path: data/funding/binance_orcausdt_funding.csv  # Binance 历史 funding CSV
    min_abs_funding_rate: "0.00001" # 实盘链路测试阈值先放低，避免 ORCA 当前 rate 太小不触发
    max_adverse_entry_move: "0.005" # bar 回测备用；tick 模式不使用这一项过滤
    funding_interval_hours: 1       # ORCA 当前 funding 间隔是 1 小时
    entry_milliseconds_before: 100  # funding 前 100ms 收到 tick 就提交市价单
    exit_milliseconds_after: 1000   # funding 后 1s 平仓，尽量缩短价格敞口
    use_trade_ticks: true           # live 使用 TradeTick 驱动，不等 1m bar
    request_bars: false             # tick 模式不请求历史 bar 预热
    allow_long: true                # funding 为负时允许做多收资金费
    allow_short: true               # funding 为正时允许做空收资金费
    close_positions_on_stop: true   # 停止时平仓
    event_log_path: auto            # 自动输出到 reports/backtest 或 reports/live 当前 set
    funding_refresh_seconds: 10     # live 每 10s 刷新 nextFundingTime 和 rate
    funding_income_poll_seconds: 3  # funding 后每 3s 查一次真实到账
    funding_income_lookback_minutes: 5 # 查询 funding_time 前后 5 分钟账务

# 常改：数据拉取参数。
data:
  funding_limit: 1000               # fetch_data.py 拉取最近 funding 记录数量

# 常改：live 运行参数。
live:
  account_type: USDT_FUTURES        # Binance U 本位合约账户
  log_level_file: INFO              # live_raw.log 文件日志级别

# 常改：回测资金和账户。
backtest:
  starting_balance: "100000 USDT"   # 回测初始资金
  account_type: MARGIN              # NT 回测账户类型
  oms_type: NETTING                 # 净持仓模式
  log_level: INFO                   # NT 日志级别
  log_bypass: true                  # 批量迭代时先关闭完整 NT logo 日志
  data:
    limit: 1000                     # 每批拉取 K 线数量
    batches: 3                      # 回测备用数据量
  instrument:
    settlement_currency: USDT       # 结算币
    is_inverse: false               # false 表示 U 本位正向合约
    price_precision: 7              # Binance ORCAUSDT pricePrecision
    size_precision: 1               # Binance ORCAUSDT quantityPrecision
    price_increment: "0.0010000"    # 最小价格跳动
    size_increment: "0.1"           # 最小数量跳动
    multiplier: "1"                 # 合约乘数
    min_quantity: "0.1"             # 最小下单数量
    max_quantity: "200000"          # 测试网 ORCAUSDT 最大数量
    min_notional: "5"               # 最小名义金额
    max_price: "2000"               # 允许最大价格
    margin_init: "1"                # 回测用初始保证金比例
    margin_maint: "1"               # 回测用维持保证金比例
    maker_fee: "0.0002"             # maker 手续费率
    taker_fee: "0.0005"             # taker 手续费率

# 低频：live 只需要市场类型来推导 NT symbol。
instrument:
  kind: perpetual                   # U 本位永续合约
