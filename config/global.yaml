# node 本身只保留身份名；运行时会追加 node 序号生成 trader_id。
node:
  name: trader

# NT cache 容量。
cache:
  tick_capacity: 1000
  bar_capacity: 1000

# NT logging 默认值；策略 set 只覆盖有差异的叶子。
logging:
  log_level: INFO
  log_level_file: INFO
  strategy_log_level: INFO
  log_colors: true
  clear_log_file: true
  component_levels:
    Portfolio: INFO
    DataRecorder: INFO
    ExecClient-BINANCE: WARNING
    BinanceSpotInstrumentProvider: WARNING
    BinanceFuturesInstrumentProvider: WARNING

# NT data engine 和所有可选 data client。
data:
  engine:
    validate_data_sequence: false
    qsize: 100000

  clients:
    binance_spot:
      enabled: false
      markets: []

    binance_futures:
      enabled: false
      markets: []

    polymarket:
      enabled: false
      markets: []
      signature_type: 1
      instrument_provider:
        load_all: false
        use_gamma_markets: true
        event_slug_builder: null

    external_signal:
      enabled: false
      host: 127.0.0.1
      port: 9001

# NT exec engine 和所有可选 exec client。
exec:
  engine:
    reconciliation: true
    reconciliation_scope: null
    qsize: 100000

  clients:
    binance_futures:
      enabled: false
      markets: []
      margin_type: CROSS
      leverage: 1

    polymarket:
      enabled: false
      markets: []
      signature_type: 1
      instrument_provider:
        load_all: false
        use_gamma_markets: true
        event_slug_builder: null

# NT actor。
actors:
  data_recorder:
    enabled: false

# 报告输出。
reports:
  enabled: true
  root: reports

# 项目路径。
project:
  data_dir: data

# 回测默认模块参数。
backtest:
  client: binance_futures
  markets: []
  venue_account:
    starting_balance: "100000 USDT"
    account_type: MARGIN
    oms_type: NETTING
  logging:
    log_level: INFO
    bypass: false
  data:
    timeframe: 1s
    limit: 1000
    batches: 3
  instrument:
    settlement_currency: USDT
    is_inverse: false
    price_precision: 2
    size_precision: 3
    price_increment: "0.01"
    size_increment: "0.001"
    multiplier: "1"
    min_quantity: "0.001"
    max_quantity: "10000"
    min_notional: "5"
    max_price: "10000000"
    margin_init: "1"
    margin_maint: "1"
    maker_fee: "0.0002"
    taker_fee: "0.0005"
